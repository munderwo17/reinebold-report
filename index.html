<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reinebold Report</title>
<style>
  :root{--ink:#0b1d2a;--paper:#f4efe1;--gold:#c9a227;--blood:#8f2d2d;--turf:#123c2b;--chalk:#f7f4ea;--steel:#2b4b63;--pad:clamp(18px,5vw,40px);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 20% 0%,rgba(201,162,39,.10),transparent 40%),linear-gradient(160deg,#0b1d2a,#123c2b);color:var(--ink);line-height:1.6;padding:clamp(10px,3vw,24px);overflow-wrap:break-word;}
  .page{max-width:960px;margin:0 auto;background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.55);border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.2);}
  header{background:linear-gradient(135deg,var(--ink),var(--steel));color:var(--chalk);padding:clamp(26px,6vw,38px) var(--pad) clamp(22px,5vw,30px);position:relative;border-bottom:6px solid var(--gold);}
  header .kicker{letter-spacing:clamp(.15em,1.2vw,.5em);text-transform:uppercase;font-size:clamp(.6rem,2.4vw,.7rem);color:var(--gold);font-family:"Arial Black",Arial,sans-serif;font-weight:800;}
  header h1{font-size:clamp(2rem,9vw,3.4rem);line-height:1.02;margin:.15em 0;font-weight:900;text-shadow:2px 2px 0 rgba(0,0,0,.35);}
  header h1 span{color:var(--gold);}
  header .sub{font-style:italic;opacity:.9;font-size:clamp(.9rem,3.2vw,1.05rem);}
  header .byline{margin-top:14px;font-size:clamp(.72rem,2.6vw,.85rem);letter-spacing:.05em;border-top:1px dashed rgba(255,255,255,.3);padding-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center;}
  header .byline b{color:var(--gold);}
  .weekpick{background:rgba(0,0,0,.25);color:var(--chalk);border:1px solid var(--gold);border-radius:20px;padding:5px 12px;font-family:Arial,sans-serif;font-size:.8rem;}
  .content{padding:clamp(22px,5vw,34px) var(--pad) clamp(30px,7vw,46px);}
  .lede{font-size:clamp(1rem,3.6vw,1.15rem);border-left:5px solid var(--blood);padding:6px 0 6px 16px;margin-bottom:28px;font-style:italic;color:#2a2a2a;}
  h2.section{font-family:"Arial Black",Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(1.05rem,4.5vw,1.35rem);margin:34px 0 16px;padding-bottom:8px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  h2.section .num{background:var(--blood);color:#fff;font-size:.85rem;padding:3px 10px;border-radius:20px;}
  .game{background:#fff;border:1px solid #e0d7c2;border-radius:8px;margin-bottom:22px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .score{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:linear-gradient(90deg,#123c2b,#1c5a41);color:#fff;padding:16px clamp(14px,4vw,20px);}
  .score .team{font-weight:bold;font-size:clamp(.95rem,3.6vw,1.05rem);flex:1 1 45%;}
  .score .team small{display:block;font-weight:normal;opacity:.75;font-size:.72rem;font-style:italic;}
  .score .vs{color:var(--gold);font-style:italic;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;}
  .score .r{text-align:right;}
  .score .pts{font-size:clamp(1.4rem,6vw,2rem);font-family:"Arial Black",Arial,sans-serif;display:inline-block;}
  .win{color:var(--gold);} .win::after{content:" \1F3C6";}
  .recap{padding:16px clamp(16px,4vw,22px);} .recap p{margin-bottom:10px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .tag{font-family:Arial,sans-serif;font-size:.72rem;padding:3px 9px;border-radius:14px;}
  .tag.stud{background:#e4f0e7;color:var(--turf);} .tag.dud{background:#f6e4e4;color:var(--blood);}
  .talk{background:#fbf6e7;border:1px dashed var(--blood);border-radius:6px;padding:12px 14px;margin-top:12px;font-style:italic;color:var(--blood);}
  .talk::before{content:"\1F5E3 TRASH TALK";font-family:Arial,sans-serif;font-style:normal;font-weight:800;font-size:.62rem;letter-spacing:.12em;color:var(--blood);display:block;margin-bottom:4px;opacity:.8;}
  .awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;}
  .award{background:#fff;border-top:5px solid var(--gold);border-radius:6px;padding:15px 16px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .award h3{font-family:Arial,sans-serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blood);margin-bottom:6px;}
  .award .big{font-size:clamp(1rem,4vw,1.15rem);font-weight:bold;} .award .small{font-size:.85rem;color:#555;font-style:italic;}
  .quotebox{background:var(--ink);color:var(--chalk);padding:clamp(18px,5vw,24px) clamp(20px,5vw,28px);border-radius:8px;margin:30px 0;border-left:6px solid var(--gold);}
  .quotebox p{font-style:italic;font-size:clamp(1rem,4vw,1.1rem);}
  .quotebox .attr{margin-top:10px;text-align:right;color:var(--gold);font-family:Arial,sans-serif;font-size:.8rem;}
  .power-wrap{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);}
  table.power{width:100%;border-collapse:collapse;}
  table.power th{background:var(--ink);color:var(--gold);font-family:Arial,sans-serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;text-align:left;}
  table.power td{padding:10px 12px;border-bottom:1px solid #eee;font-size:.95rem;vertical-align:top;}
  table.power tr:nth-child(even) td{background:#faf7ee;}
  .rank{font-family:"Arial Black",Arial,sans-serif;color:var(--blood);} .rec{font-size:.8rem;color:#777;}
  @media (max-width:600px){
    table.power thead{display:none;}
    table.power,table.power tbody,table.power tr,table.power td{display:block;width:100%;}
    table.power tr{border-bottom:2px solid #eadfc4;padding:12px 14px;position:relative;}
    table.power tr:nth-child(even) td{background:transparent;}
    table.power td{border:none;padding:2px 0;font-size:.92rem;}
    table.power td[data-label]::before{content:attr(data-label) ": ";font-family:Arial,sans-serif;font-weight:700;font-size:.68rem;text-transform:uppercase;color:var(--blood);}
    td.team-cell{font-weight:bold;font-size:1.05rem;margin-bottom:4px;padding-right:44px!important;}
    td.team-cell::before{content:none!important;}
    td.rank-cell{position:absolute;top:12px;right:12px;background:var(--blood);color:#fff;font-family:"Arial Black",Arial,sans-serif;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    td.rank-cell::before{content:none!important;}
  }
  footer{background:var(--ink);color:#9fb0bd;padding:24px var(--pad);font-size:.8rem;text-align:center;border-top:6px solid var(--gold);}
  footer b{color:var(--gold);}
  .disclaimer{font-size:.68rem;opacity:.6;margin-top:8px;font-style:italic;}
  .loading{color:var(--chalk);text-align:center;padding:60px 20px;font-style:italic;}
  .error{color:#ffb4b4;text-align:center;padding:60px 20px;}
</style>
</head>
<body>
<div class="page" id="report"><div class="loading">Loading the tape…</div></div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadManifest(){
  try { const r = await fetch('weeks/manifest.json',{cache:'no-store'}); if(r.ok) return await r.json(); }
  catch(e){}
  return null;
}

function pickWeek(manifest){
  const q = new URLSearchParams(location.search).get('week');
  if (q) return parseInt(q,10);
  if (manifest && manifest.latest) return manifest.latest;
  return 1;
}

async function main(){
  const manifest = await loadManifest();
  const wk = pickWeek(manifest);
  let data;
  try {
    const res = await fetch(`weeks/week-${wk}.json`, {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch(e){
    document.getElementById('report').innerHTML =
      `<div class="error">Couldn't load Week ${esc(wk)}. Make sure <code>weeks/week-${esc(wk)}.json</code> exists.</div>`;
    return;
  }
  render(data, manifest, wk);
  document.title = `${data.title} — Week ${data.week}`;
}

function weekPicker(manifest, current){
  if(!manifest || !manifest.weeks || manifest.weeks.length < 2) return '';
  const opts = manifest.weeks.map(w =>
    `<option value="${w}" ${w===current?'selected':''}>Week ${w}</option>`).join('');
  return `<select class="weekpick" onchange="location.search='?week='+this.value">${opts}</select>`;
}

function render(d, manifest, wk){
  const games = (d.matchups||[]).map((m,i) => {
    const studs = (m.studs||[]).map(s=>`<span class="tag stud">${esc(s)}</span>`).join('');
    const duds  = (m.duds||[]).map(s=>`<span class="tag dud">${esc(s)}</span>`).join('');
    return `<div class="game">
      <div class="score">
        <div class="team win">${esc(m.winner.team)}<small>${esc([m.winner.manager,m.winner.record].filter(Boolean).join(' • '))}</small></div>
        <div class="vs">def.</div>
        <div class="team r">${esc(m.loser.team)}<br>
          <span class="pts win">${esc(m.winner.points)}</span> <span class="pts">– ${esc(m.loser.points)}</span></div>
      </div>
      <div class="recap">
        <p>${esc(m.recap)}</p>
        ${(studs||duds)?`<div class="tags">${studs}${duds}</div>`:''}
        ${m.trashTalk?`<div class="talk">${esc(m.trashTalk)}</div>`:''}
      </div></div>`;
  }).join('');

  const awards = (d.awards||[]).map(a=>`<div class="award">
      <h3>${esc(a.icon||'')} ${esc(a.label)}</h3>
      <div class="big">${esc(a.value)}</div>
      <div class="small">${esc(a.note||'')}</div></div>`).join('');

  const rankRows = (d.powerRankings||[]).map(r=>`<tr>
      <td class="rank-cell rank" data-label="Rank">${esc(r.rank)}</td>
      <td class="team-cell">${esc(r.team)}</td>
      <td data-label="Points">${esc(r.points)}</td>
      <td class="rec" data-label="Record">${esc(r.record)}</td>
      <td data-label="Take">${esc(r.take)}</td></tr>`).join('');

  document.getElementById('report').innerHTML = `
    <header>
      <div class="kicker">The Jeff Reinebowl • Week ${esc(d.week)}</div>
      <h1>${esc(d.title).replace('Reinebold','<span>Reinebold</span>')}</h1>
      <p class="sub">${esc(d.subtitle||'')}</p>
      <div class="byline">
        <span>${esc(d.tagline||'')}</span>
        <span>By <b>${esc(d.author||'Jeff Reinebold')}</b> ${weekPicker(manifest, wk)}</span>
      </div>
    </header>
    <div class="content">
      ${d.lede?`<p class="lede">${esc(d.lede)}</p>`:''}
      <h2 class="section"><span class="num">01</span>The Games</h2>
      ${games}
      <h2 class="section"><span class="num">02</span>Reinebold's Weekly Hardware</h2>
      <div class="awards">${awards}</div>
      ${d.momentOfWeek?`<h2 class="section"><span class="num">03</span>Moment of the Week</h2>
        <div class="quotebox"><p>${esc(d.momentOfWeek.text)}</p>
        <div class="attr">${esc(d.momentOfWeek.attribution||'')}</div></div>`:''}
      <h2 class="section"><span class="num">04</span>Power Rankings</h2>
      <div class="power-wrap"><table class="power">
        <thead><tr><th>#</th><th>Team</th><th>Pts</th><th>Rec</th><th>Reinebold's Take</th></tr></thead>
        <tbody>${rankRows}</tbody></table></div>
      ${d.lastWord?`<h2 class="section"><span class="num">05</span>The Last Word</h2><p>${esc(d.lastWord)}</p>`:''}
    </div>
    <footer><b>THE REINEBOLD REPORT</b> — A weekly dispatch from The Jeff Reinebowl<br>
      ${esc(d.footerTagline||'')}
      <div class="disclaimer">A parody publication written in the spirit of Jeff Reinebold for entertainment among leaguemates.</div>
    </footer>`;
}
main();
</script>
</body>
</html>
